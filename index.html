<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توپ شب‌تاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
  /* Layout: one full-height stage; HUD floats over the canvas; overlays sit centered on a frosted card. */
  :root {
    --sky-top: #1b1440;
    --sky-bottom: #0e2a47;
    --ink: #f4efff;
    --muted: #b7b0d8;
    --ball: #ffb86b;
    --paddle: #7ee0d2;
    --star: #ffe27a;
    --heart: #ff6f91;
    --card: rgba(22, 16, 54, 0.72);
    --edge: rgba(255, 255, 255, 0.14);
    --font-display: "Lalezar", "Vazirmatn", system-ui, sans-serif;
    --font-body: "Vazirmatn", "Tahoma", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .stage { position: relative; height: 100%; width: 100%; touch-action: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .hud {
    position: absolute; inset-inline: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    pointer-events: none;
  }
  .score { display: flex; flex-direction: column; line-height: 1; }
  .score b { font-family: var(--font-display); font-size: 2.6rem; font-weight: 400; color: var(--ink); font-variant-numeric: tabular-nums; }
  .score span { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.02em; margin-top: 4px; }
  .right { display: flex; align-items: center; gap: 10px; }
  .hearts { font-size: 1.3rem; color: var(--heart); letter-spacing: 2px; }
  .icon-btn {
    pointer-events: auto;
    border: 1px solid var(--edge); background: var(--card); color: var(--ink);
    width: 40px; height: 40px; border-radius: 50%; font-size: 1.05rem; cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:focus-visible, .play:focus-visible { outline: 2px solid var(--paddle); outline-offset: 3px; }

  .overlay {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
  }
  .card {
    background: var(--card); border: 1px solid var(--edge);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-radius: 22px; padding: 28px 26px; max-width: 360px; width: 100%;
    text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: rise 0.45s ease-out;
  }
  .card h1 {
    font-family: var(--font-display); font-weight: 400; margin: 0;
    font-size: 3rem; line-height: 1.1; text-wrap: balance;
    background: linear-gradient(90deg, var(--ball), var(--star));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { margin: 0; color: var(--muted); line-height: 1.9; font-size: 0.95rem; }
  .card .big { font-family: var(--font-display); font-size: 3.4rem; color: var(--ink); line-height: 1; }
  .rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 0.9rem; color: var(--muted); }
  .rules i { font-style: normal; display: inline-block; width: 1.4em; }
  .play {
    font-family: var(--font-display); font-size: 1.5rem;
    border: 0; border-radius: 999px; padding: 10px 38px; cursor: pointer;
    background: linear-gradient(90deg, var(--ball), var(--star)); color: #3a1d00;
    box-shadow: 0 8px 28px rgba(255, 184, 107, 0.35);
    transition: transform 0.15s ease;
  }
  .play:hover { transform: translateY(-2px) scale(1.03); }
  .hint { font-size: 0.78rem; color: var(--muted); opacity: 0.85; }

  @keyframes rise { from { transform: translateY(14px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } .play { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="score"><b id="score">۰</b><span id="best">رکورد: ۰</span></div>
    <div class="right">
      <div class="hearts" id="hearts" aria-label="جان‌ها">♥♥♥</div>
      <button class="icon-btn" id="sound" type="button" aria-label="صدا">♪</button>
      <button class="icon-btn" id="pause" type="button" aria-label="توقف">❚❚</button>
    </div>
  </div>

  <div class="overlay" id="menu">
    <div class="card">
      <h1>توپ شب‌تاب</h1>
      <p>نگذار توپ به زمین بیفتد. هر بار که با تخته به توپ بزنی، توپ کمی تندتر می‌شود.</p>
      <ul class="rules">
        <li><i>●</i>ضربه با تخته: ۱ امتیاز</li>
        <li><i>★</i>گرفتن ستاره: ۵ امتیاز</li>
        <li><i>♥</i>سه جان داری</li>
      </ul>
      <button class="play" id="start" type="button">شروع</button>
      <span class="hint">با موس، انگشت یا کلیدهای ← → بازی کن</span>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <p>امتیاز تو</p>
      <div class="big" id="final">۰</div>
      <p id="verdict">آفرین!</p>
      <button class="play" id="again" type="button">دوباره</button>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="card">
      <h1>مکث</h1>
      <button class="play" id="resume" type="button">ادامه</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const $ = (id) => document.getElementById(id);
  const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const COLORS = { ball: "#ffb86b", paddle: "#7ee0d2", star: "#ffe27a", heart: "#ff6f91" };

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paddle.w = Math.max(90, Math.min(150, W * 0.22));
    paddle.y = H - 56;
    paddle.x = Math.min(Math.max(paddle.x || W / 2, paddle.w / 2), W - paddle.w / 2);
    makeSky();
  }

  // Background stars that twinkle softly.
  let sky = [];
  function makeSky() {
    const count = Math.round((W * H) / 9000);
    sky = Array.from({ length: count }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.3 + 0.3, p: Math.random() * Math.PI * 2,
    }));
  }

  const paddle = { x: 0, y: 0, w: 120, h: 14, target: null, glow: 0 };
  const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 11, trail: [] };
  let star = null;
  let particles = [];
  let score = 0, lives = 3, speed = 0, shake = 0;
  let state = "menu"; // menu | serve | play | paused | over
  let serveTimer = 0;
  let best = 0;
  try { best = Number(localStorage.getItem("peji-ball-best")) || 0; } catch (e) {}

  // --- sound ---
  let audio = null, muted = false;
  function beep(freq, dur = 0.08, type = "sine", vol = 0.15) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }

  // --- HUD ---
  function updateHud() {
    $("score").textContent = fa(score);
    $("best").textContent = "رکورد: " + fa(best);
    $("hearts").textContent = "♥".repeat(lives) + "♡".repeat(3 - lives);
  }

  function burst(x, y, color, n = 14, power = 3) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, r: Math.random() * 2.5 + 1 });
    }
  }

  function serve() {
    ball.x = paddle.x; ball.y = paddle.y - 80;
    ball.vx = 0; ball.vy = 0; ball.trail = [];
    state = "serve"; serveTimer = 0.8;
  }

  function launch() {
    const base = 5.2 + speed;
    const angle = (Math.random() * 0.8 - 0.4) - Math.PI / 2;
    ball.vx = Math.cos(angle) * base;
    ball.vy = Math.sin(angle) * base;
    state = "play";
  }

  function newGame() {
    score = 0; lives = 3; speed = 0; star = null; particles = [];
    $("menu").hidden = true; $("over").hidden = true; $("paused").hidden = true;
    updateHud(); serve();
    beep(520, 0.1, "triangle");
  }

  function gameOver() {
    state = "over";
    if (score > best) {
      best = score;
      try { localStorage.setItem("peji-ball-best", String(best)); } catch (e) {}
      $("verdict").textContent = "رکورد تازه! 🎉";
    } else {
      $("verdict").textContent = score >= 20 ? "خیلی خوب بود!" : "یک بار دیگر امتحان کن";
    }
    $("final").textContent = fa(score);
    updateHud();
    $("over").hidden = false;
    $("again").focus();
    beep(220, 0.35, "sawtooth", 0.08);
  }

  function spawnStar() {
    star = { x: 40 + Math.random() * (W - 80), y: 110 + Math.random() * (H * 0.45), r: 14, t: 0 };
  }

  function setPaused(p) {
    if (p && (state === "play" || state === "serve")) {
      state = "paused"; $("paused").hidden = false; $("resume").focus();
    } else if (!p && state === "paused") {
      state = ball.vx || ball.vy ? "play" : "serve"; $("paused").hidden = true;
    }
  }

  // --- input ---
  const keys = { left: false, right: false };
  function pointerTo(e) {
    const rect = canvas.getBoundingClientRect();
    paddle.target = e.clientX - rect.left;
  }
  $("stage").addEventListener("pointermove", pointerTo);
  $("stage").addEventListener("pointerdown", pointerTo);
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { keys.left = true; paddle.target = null; }
    if (e.key === "ArrowRight") { keys.right = true; paddle.target = null; }
    if (e.key === " " || e.key === "p" || e.key === "Escape") {
      if (state === "paused") setPaused(false); else setPaused(true);
      if (e.key === " ") e.preventDefault();
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) setPaused(true); });

  $("start").addEventListener("click", newGame);
  $("again").addEventListener("click", newGame);
  $("resume").addEventListener("click", () => setPaused(false));
  $("pause").addEventListener("click", () => setPaused(state !== "paused"));
  $("sound").addEventListener("click", () => {
    muted = !muted;
    $("sound").textContent = muted ? "✕" : "♪";
    $("sound").setAttribute("aria-label", muted ? "صدا خاموش" : "صدا");
  });

  // --- update ---
  function update(dt) {
    const k = dt * 60; // normalize to 60fps steps

    // Paddle movement (works in every state so the menu feels alive).
    if (keys.left) paddle.x -= 9 * k;
    if (keys.right) paddle.x += 9 * k;
    if (paddle.target != null) paddle.x += (paddle.target - paddle.x) * Math.min(1, 0.35 * k);
    paddle.x = Math.min(Math.max(paddle.x, paddle.w / 2), W - paddle.w / 2);
    paddle.glow = Math.max(0, paddle.glow - dt * 3);

    if (state === "serve") {
      ball.x += (paddle.x - ball.x) * 0.2;
      serveTimer -= dt;
      if (serveTimer <= 0) launch();
    }

    if (state === "play") {
      // Sub-step so the fast ball never tunnels through the paddle.
      const steps = Math.ceil(Math.hypot(ball.vx, ball.vy) * k / 6);
      for (let i = 0; i < steps && state === "play"; i++) stepBall(k / steps);

      if (!star && Math.random() < 0.004 * k) spawnStar();
    }

    if (star) {
      star.t += dt;
      if (state === "play" && Math.hypot(ball.x - star.x, ball.y - star.y) < ball.r + star.r) {
        score += 5; updateHud();
        burst(star.x, star.y, COLORS.star, 26, 4.5);
        beep(880, 0.08, "triangle"); setTimeout(() => beep(1320, 0.12, "triangle"), 70);
        star = null;
      } else if (star.t > 7) star = null;
    }

    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 14) ball.trail.shift();

    particles.forEach((p) => {
      p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.08 * k; p.vx *= 0.98; p.life -= dt * 1.4;
    });
    particles = particles.filter((p) => p.life > 0);
    shake = Math.max(0, shake - dt * 30);
  }

  function stepBall(k) {
    ball.x += ball.vx * k; ball.y += ball.vy * k;

    if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); beep(330, 0.04); }
    if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); beep(330, 0.04); }
    if (ball.y < ball.r + 70) { ball.y = ball.r + 70; ball.vy = Math.abs(ball.vy); beep(330, 0.04); }

    // Paddle hit: bounce angle depends on where the ball lands on the paddle.
    const top = paddle.y - paddle.h / 2;
    if (ball.vy > 0 && ball.y + ball.r >= top && ball.y - ball.r <= paddle.y + paddle.h / 2 &&
        Math.abs(ball.x - paddle.x) <= paddle.w / 2 + ball.r) {
      ball.y = top - ball.r;
      const offset = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
      const angle = offset * (Math.PI / 3) - Math.PI / 2;
      speed = Math.min(speed + 0.22, 8);
      const s = 5.2 + speed;
      ball.vx = Math.cos(angle) * s; ball.vy = Math.sin(angle) * s;
      score += 1; updateHud();
      paddle.glow = 1;
      burst(ball.x, top, COLORS.paddle, 10, 2.5);
      beep(440 + Math.min(score, 40) * 12, 0.07, "triangle");
    }

    if (ball.y - ball.r > H) {
      lives -= 1; updateHud();
      shake = reduceMotion ? 0 : 10;
      burst(ball.x, H - 4, COLORS.heart, 24, 5);
      beep(160, 0.25, "square", 0.07);
      speed = Math.max(0, speed - 1.5);
      if (lives <= 0) gameOver(); else serve();
    }
  }

  // --- draw ---
  let time = 0;
  function draw() {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    // twinkling sky
    for (const s of sky) {
      const a = reduceMotion ? 0.55 : 0.35 + 0.35 * Math.sin(time * 1.6 + s.p);
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // soft floor glow
    const floor = ctx.createLinearGradient(0, H - 90, 0, H);
    floor.addColorStop(0, "rgba(126,224,210,0)");
    floor.addColorStop(1, "rgba(126,224,210,0.12)");
    ctx.fillStyle = floor; ctx.fillRect(0, H - 90, W, 90);

    // bonus star
    if (star) {
      const pulse = 1 + Math.sin(star.t * 6) * 0.12;
      const fade = star.t > 6 ? 7 - star.t : Math.min(1, star.t * 3);
      ctx.save();
      ctx.globalAlpha = Math.max(0, fade);
      ctx.translate(star.x, star.y); ctx.rotate(star.t * 1.2); ctx.scale(pulse, pulse);
      ctx.shadowColor = COLORS.star; ctx.shadowBlur = 22;
      ctx.fillStyle = COLORS.star;
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? star.r * 0.45 : star.r;
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ball trail + ball
    if (state !== "menu") {
      ball.trail.forEach((t, i) => {
        const f = (i + 1) / ball.trail.length;
        ctx.fillStyle = `rgba(255,184,107,${f * 0.35})`;
        ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * f, 0, Math.PI * 2); ctx.fill();
      });
      const blink = state === "serve" ? 0.5 + 0.5 * Math.sin(time * 18) : 1;
      ctx.globalAlpha = blink;
      ctx.shadowColor = COLORS.ball; ctx.shadowBlur = 24;
      const g = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.r);
      g.addColorStop(0, "#fff3e0"); g.addColorStop(1, COLORS.ball);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }

    // paddle
    ctx.shadowColor = COLORS.paddle; ctx.shadowBlur = 14 + paddle.glow * 26;
    ctx.fillStyle = COLORS.paddle;
    roundRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, paddle.h / 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now; time += dt;
    if (state !== "paused" && state !== "over") update(dt);
    else if (state === "over") { // let particles settle behind the card
      particles.forEach((p) => { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= dt * 1.4; });
      particles = particles.filter((p) => p.life > 0);
    }
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  paddle.x = W / 2;
  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
