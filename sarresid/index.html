<title>سررسید دوزبانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: header with the day's date, a composer row (write → Claude organizes), then tabbed views
   shown as two side-by-side panes: Persian (RTL) and Thai (LTR). Stacks to one column on phones. */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D9DEE9;
  --ink:#17203A; --muted:#5B6580; --primary:#22305C; --on-primary:#FFFFFF;
  --accent:#DE9227; --accent-soft:#FBEBD2; --good:#1E9466; --bad:#CF4040;
  --chip-bg-l:92%; --chip-fg-l:30%; --shadow:0 1px 2px rgba(23,32,58,.06),0 6px 20px rgba(23,32,58,.06);
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-th:"Sarabun","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2B; --surface-2:#1C2234; --line:#2A3148;
  --ink:#E6E9F2; --muted:#98A1B9; --primary:#B4C3FF; --on-primary:#0E1220;
  --accent:#F0AE4E; --accent-soft:#3A2D18; --good:#47C08E; --bad:#F07070;
  --chip-bg-l:22%; --chip-fg-l:80%; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2B; --surface-2:#1C2234; --line:#2A3148;
  --ink:#E6E9F2; --muted:#98A1B9; --primary:#B4C3FF; --on-primary:#0E1220;
  --accent:#F0AE4E; --accent-soft:#3A2D18; --good:#47C08E; --bad:#F07070;
  --chip-bg-l:22%; --chip-fg-l:80%; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-fa);font-size:15px;line-height:1.6}
[lang="th"]{font-family:var(--f-th)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1;letter-spacing:0}
.brand .sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status-dot.on i{background:var(--good)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);color:#1C1406;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}

/* hero row */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.composer{padding:16px;display:grid;gap:12px}
.composer label.lbl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.composer textarea{width:100%;min-height:118px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;line-height:1.75;font-family:var(--f-fa),var(--f-th)}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.comp-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.ex{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.ex:hover{color:var(--ink);border-color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.side{display:grid;gap:18px;grid-template-rows:auto 1fr}
.ringcard{padding:16px;display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{fill:var(--ink);font-weight:800;font-size:19px;font-family:var(--f-fa)}
.ringcard .k{font-size:13px;color:var(--muted)}
.ringcard .v{font-weight:700;font-size:15px}
.stats{display:grid;gap:4px}
.stats .row{display:flex;gap:8px;align-items:center;font-size:13px}
.stats .row b{font-variant-numeric:tabular-nums}
.pill{display:inline-block;min-width:22px;text-align:center;border-radius:99px;padding:0 7px;font-size:12px;font-weight:700}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.next{padding:16px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
.next .eyebrow{font-size:12px;color:var(--muted);letter-spacing:.02em}
.next .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.next .ti{font-weight:700}
.next .th{color:var(--muted);font-size:14px}
.next .cd{font-size:13px;color:var(--muted)}

/* reply */
.reply{padding:14px 16px;display:grid;gap:10px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.reply-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.reply-head b{display:flex;align-items:center;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo > div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0;white-space:pre-wrap}
.duo .tag{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;font-family:var(--f-fa)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs,.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.tabs .count{font-size:11.5px;opacity:.8}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{border:0;background:transparent;padding:8px 2px;width:170px;outline:none}
.search svg{width:16px;height:16px;color:var(--muted)}

/* panes */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.panes.single{grid-template-columns:1fr}
.pane{padding:16px;display:grid;gap:14px;min-width:0}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-size:18px;font-weight:800}
.pane[lang="th"] .pane-head h2{font-family:var(--f-th);font-weight:700}
.flag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.sec{display:grid;gap:8px}
.sec > h3{margin:0;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.sec > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec.overdue > h3{color:var(--bad)}

/* timeline */
.tl{display:grid;gap:0;position:relative}
.tl-row{display:grid;grid-template-columns:56px 18px minmax(0,1fr);align-items:start;min-height:20px}
.tl-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;padding-top:11px;color:var(--muted)}
.tl-axis{position:relative;align-self:stretch}
.tl-axis::before{content:"";position:absolute;inset-inline-start:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-axis::after{content:"";position:absolute;inset-inline-start:4px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid hsl(var(--h,220) 60% 50%)}
.tl-row.past .tl-time{opacity:.6}
.tl-row .item{margin-block:4px}
.now{display:grid;grid-template-columns:56px 18px 1fr;align-items:center;height:18px}
.now span{font-size:11.5px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.now i{height:2px;background:var(--accent);grid-column:2 / 4;position:relative}
.now i::before{content:"";position:absolute;inset-inline-start:3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* item */
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:9px 11px;transition:border-color .15s;position:relative}
.item:hover{border-color:var(--line)}
.item.prio-high{box-shadow:inset 3px 0 0 var(--bad)}
[dir="rtl"] .item.prio-high{box-shadow:inset -3px 0 0 var(--bad)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid hsl(var(--h,220) 45% 55%);background:transparent;display:grid;place-items:center;margin-top:2px;padding:0}
.check svg{width:13px;height:13px;opacity:0;color:#fff}
.item.done .check{background:var(--good);border-color:var(--good)}
.item.done .check svg{opacity:1}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.item .body{min-width:0;cursor:pointer}
.ttl{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:0 9px;font-size:12px;font-weight:500;background:hsl(var(--h) 65% var(--chip-bg-l));color:hsl(var(--h) 55% var(--chip-fg-l));white-space:nowrap}
.kind{display:inline-flex;align-items:center;gap:3px}
.kind svg{width:13px;height:13px}
.detail{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.missing{color:var(--bad);font-size:12px}
.amount{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ibtn{border:0;background:transparent;color:var(--muted);padding:4px;border-radius:8px;display:grid;place-items:center}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn svg{width:16px;height:16px}

.empty{padding:22px 10px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty svg{width:46px;height:46px;opacity:.5}

/* categories + notes grid */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.cat-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cat-h b{display:flex;align-items:center;gap:8px;min-width:0}
.cat-h b i{width:10px;height:10px;border-radius:3px;background:hsl(var(--h) 60% 52%);flex:none}
.cat ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
.cat li{display:flex;gap:6px;cursor:pointer;min-width:0}
.cat li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat li.done span{text-decoration:line-through;color:var(--muted)}
.cat li em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.note{border-radius:12px;padding:12px 14px;background:hsl(var(--h) 70% var(--chip-bg-l));display:grid;gap:6px;cursor:pointer;align-content:start;border:1px solid transparent}
.note:hover{border-color:var(--line)}
.note b{overflow-wrap:anywhere}
.note p{margin:0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);opacity:.85}
.note small{color:var(--muted)}

.plan{padding:14px 16px;display:grid;gap:10px}

/* dialogs */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(760px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,14,28,.55)}
.dlg{display:grid;gap:14px;padding:18px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h2{margin:0;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.dlg-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dlg-f .grp{display:flex;gap:8px;flex-wrap:wrap}
.danger{color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:13.5px}
.opt:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.opt input{accent-color:var(--primary)}
.preview{background:#8A93A8;border-radius:12px;padding:14px;overflow:auto;max-height:46vh;display:flex;justify-content:center}
.preview iframe{border:0;background:#fff;width:794px;height:1123px;transform-origin:top center;flex:none}
.prev-box{overflow:hidden;flex:none}

/* toast + reminder */
.toasts{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:50;padding-inline:16px}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:560px;font-size:14px}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:800}
.alarm{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;margin-inline:auto;max-width:560px;z-index:60;background:var(--accent);color:#1C1406;border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.alarm svg{width:26px;height:26px}
.alarm b{display:block}
.alarm button{border:0;background:rgba(0,0,0,.12);border-radius:9px;padding:6px 10px;font-weight:700;color:inherit}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .side{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .panes{grid-template-columns:1fr}
}
@media (max-width:560px){
  .side{grid-template-columns:1fr}
  .duo,.grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .search input{width:120px}
  .brand h1{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" dir="rtl" lang="fa">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18"/><path d="M11.5 8h5M11.5 12h5M11.5 16h3"/></svg>
      </div>
      <div>
        <h1>سررسید دوزبانه</h1>
        <div class="sub"><span id="dateFa"></span><span lang="th" id="dateTh"></span></div>
      </div>
    </div>
    <div class="top-actions">
      <span class="status-dot" id="aiStatus"><i></i><span>در حال اتصال به Claude…</span></span>
      <span class="status-dot" id="syncStatus"><i></i><span>ذخیره روی همین مرورگر</span></span>
      <button class="btn accent" id="exportBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
        خروجی برای چاپ
      </button>
    </div>
  </header>

  <section class="hero">
    <form class="card composer" id="composer">
      <label class="lbl" for="inbox">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
        هر چی تو ذهنته بنویس، فارسی یا تایلندی
      </label>
      <textarea id="inbox" dir="auto" placeholder="مثلاً: فردا ساعت ۱۰ جلسه با آقای رضایی درباره لوگو، تا پنجشنبه فاکتور پروژه سایت رو بفرستم، ۵ عصر به مامان زنگ بزنم…&#10;หรือ: พรุ่งนี้บ่ายสามโมงส่งงานออกแบบให้ลูกค้า"></textarea>
      <div class="comp-row">
        <div class="examples" id="examples"></div>
        <div class="comp-row" style="gap:8px">
          <span class="hint">Ctrl + Enter</span>
          <button class="btn ghost" type="button" id="stopBtn" hidden>توقف</button>
          <button class="btn primary" type="submit" id="sendBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg>
            مرتب کن و ثبت کن
          </button>
        </div>
      </div>
      <div class="thinking" id="thinking" hidden><span class="spin"></span><span id="thinkingText">Claude داره متنت رو می‌خونه و دسته‌بندی می‌کنه…</span></div>
    </form>

    <div class="side">
      <div class="card ringcard">
        <svg class="ring" viewBox="0 0 84 84" aria-hidden="true">
          <circle class="bg" cx="42" cy="42" r="35"/>
          <circle class="fg" id="ringFg" cx="42" cy="42" r="35" stroke-dasharray="219.9" stroke-dashoffset="219.9" transform="rotate(-90 42 42)"/>
          <text x="42" y="49" text-anchor="middle" id="ringTxt">۰٪</text>
        </svg>
        <div class="stats">
          <div class="k">کارهای امروز · <span lang="th">งานวันนี้</span></div>
          <div class="v" id="todayCount">—</div>
          <div class="row"><span class="pill bad" id="overdueCount">۰</span> عقب‌افتاده</div>
          <div class="row"><span class="pill ok" id="weekCount">۰</span> تا ۷ روز آینده</div>
        </div>
      </div>
      <div class="card next" id="nextCard"></div>
    </div>
  </section>

  <section class="card reply" id="replyCard" hidden></section>

const prefs = Object.assign({ view:"today", lang:"both" }, lsGet(PKEY, {}));

function loadLocal() { (lsGet(LKEY, []) || []).forEach(i => i && i.id && S.items.set(i.id, i)); }

async function connectCloud() {
  if (!window.claude || !window.claude.use) return;

  if (!db || !user) return;

  if (!id) return;
  const col = db.doc("data/users/" + id + "/space").collection("items");
  let snap; try { snap = await col.limit(1000).get(); } catch { return; }

}

}

/* ---------- Claude ---------- */
function setAI(state) {

}
function context() {
  const now = new Date(), t = todayISO();
  const cats = [...new Map([...S.items.values()].map(i => [catKey(i), [i.category_fa || "", i.category_th || ""]])).values()].slice(0, 40);
  const open = [...S.items.values()].filter(i => !i.done && (i.kind !== "note" || (i.date && i.date >= addDays(t, -7))))
    .sort((a, b) => (a.date || "9999").localeCompare(b.date || "9999") || (a.time || "").localeCompare(b.time || "")).slice(0, 120)
    .map(i => `${i.id} | ${i.kind} | ${i.date || "-"} | ${i.time || "-"} | ${i.title_fa || ""} / ${i.title_th || ""} | ${i.category_fa || ""}`).join("\n");

  return { now, t, cats, open, week };
}
function organizePrompt(text) {
  const c = context();

Current local date-time: ${c.t} ${nowHM()} (${c.now.toLocaleDateString("en-US",{weekday:"long"})}). Jalali today: ${fmt("fa-IR-u-ca-persian",{year:"numeric",month:"long",day:"numeric"}).format(c.now)}.
Next 7 days:
${c.week}

Existing categories [Persian, Thai]: ${JSON.stringify(c.cats)}
Open items (id | kind | date | time | title fa / th | category):
${c.open || "(none)"}

The user's new message (Persian, Thai, or mixed; may contain many things at once):
"""
${text}
"""

Turn the message into structured changes for the planner.
Rules:
- Split the message into separate items, one action or one piece of information each. Do not drop anything the user wrote.
- EVERY item must be fully bilingual: write the Persian version in *_fa fields and the Thai version in *_th fields, whichever language the user wrote in. Translate naturally; keep personal names, brand names and numbers recognisable.
- kind: "task" (something to do), "event" (meeting/appointment/call at a set time), "reminder" (only needs remembering at a time), "note" (information or idea to keep, no action), "payment" (money to receive or pay).
- date: Gregorian YYYY-MM-DD. Resolve relative words (امروز، فردا، پس‌فردا، weekdays like شنبه…جمعه = the next such day, هفته بعد, Jalali dates like ۱۵ مهر, Thai: วันนี้ พรุ่งนี้ มะรืนนี้ วันจันทร์… , Thai Buddhist-era years = Gregorian + 543). If a time is given without a date: today if that time is still ahead, otherwise tomorrow. Notes and undated tasks: null. "تا پنجشنبه"/deadline: that date.
- time / end: 24h "HH:MM" or null. Persian: صبح=AM, ظهر≈12-14, عصر/بعدازظهر=PM, شب=PM. An hour 1-6 with no qualifier means PM; 7-11 with no qualifier means AM. Thai: โมงเช้า=AM, บ่าย X โมง = (12+X):00, X โมงเย็น = (12+X):00, ทุ่ม = (18+X):00, ตี X = X:00 AM.
- category_fa / category_th: a short label (client or project name, or an area like شخصی/ส่วนตัว، مالی/การเงิน، خانه/บ้าน، سلامت/สุขภาพ، کاری/งาน). Reuse an existing category when it fits.
- priority: "high" for urgent words (فوری، حتما، مهم، ددلاین، ด่วน، สำคัญ), "low" for "اگه وقت شد"/"ถ้ามีเวลา", otherwise "normal".
- title_*: short, clear, ≤ 60 characters. Extra information goes in detail_* (or "" if none).
- amount: a number or null; currency: "TOMAN", "IRR", "THB", "USD", "EUR" or null (guess THB for บาท/بات, TOMAN for تومان).

Reply with only this JSON:
{"reply_fa":"1-2 short friendly Persian sentences on what you recorded; mention anything ambiguous you guessed",
 "reply_th":"the same in Thai",
 "add":[{"kind":"task","title_fa":"","title_th":"","detail_fa":"","detail_th":"","category_fa":"","category_th":"","date":null,"time":null,"end":null,"priority":"normal","amount":null,"currency":null}],

const okDate = v => typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(toEn(v)) ? toEn(v) : null;

  if ("amount" in src) { const n = src.amount == null || src.amount === "" ? null : Number(toEn(String(src.amount)).replace(/[,٬\s]/g, "")); it.amount = isFinite(n) ? n : null; }

    const m = en.match(/(?:ساعت|เวลา)?\s*(\d{1,2})(?:[:٫.](\d{2}))?\s*(صبح|عصر|بعدازظهر|ظهر|شب)?/);
    if (m && /ساعت|เวลา|:|صبح|عصر|شب/.test(m[0])) { let h = +m[1]; if (/عصر|بعدازظهر|شب/.test(m[3] || "") && h < 12) h += 12; else if (!m[3] && h >= 1 && h <= 6) h += 12; if (h < 24) time = pad(h) + ":" + (m[2] || "00"); }

      detail_fa:"", detail_th:"", category_fa:"عمومی", category_th:"ทั่วไป", date, time, end:null, priority: /فوری|حتما|ด่วน/.test(line) ? "high" : "normal", amount:null, currency:null, done:false, created:Date.now() };

let ctl = null;

    const items = fallbackParse(text);
    for (const it of items) { batch.added.push(it.id); putItem(it, true); }
    batch.replyFa = `${faNum(items.length)} مورد ثبت شد. Claude به این صفحه وصل نیست، پس دسته‌بندی و ترجمه تایلندی انجام نشد. می‌تونی هر مورد رو باز کنی و دستی کاملش کنی.`;

    for (const raw of Array.isArray(res.add) ? res.add : []) {

    $("#inbox").value = ""; lsSet("sarresid.draft", "");

    const txt = exportText(exportSelection());
    try { await navigator.clipboard.writeText(txt); toast("متن کپی شد."); }
    catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.append(ta); ta.select(); try { document.execCommand("copy"); toast("متن کپی شد."); } catch { toast("کپی نشد."); } ta.remove(); }
  }
  else if (act === "alarm-done") { const it = S.items.get(id); if (it) putItem({ ...it, done:true }); $("#alarmHost").innerHTML = ""; }
  else if (act === "alarm-close") $("#alarmHost").innerHTML = "";
});
$("#editForm").addEventListener("submit", e => {
  e.preventDefault();
  const it = readEdit();
  if (!it.title_fa && !it.title_th) { toast("حداقل یک عنوان بنویس."); return; }
  putItem(it); $("#editDlg").close();
});

/* ---------- boot ---------- */
$("#dateFa").textContent = fmt("fa-IR-u-ca-persian", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(new Date());
$("#dateTh").textContent = fmt("th-TH", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(new Date());
loadLocal(); setSync(); render();
if (window.claude && window.claude.use) {
  claude.use("sample").then(s => { S.sample = s; setAI(s ? "on" : "off"); render(); }).catch(() => setAI("off"));
  claude.use("downloads").then(d => { S.downloads = d; }).catch(() => {});
  connectCloud().catch(() => {});
} else setAI("off");
setInterval(checkAlarms, 20000); setTimeout(checkAlarms, 1500);
setInterval(() => { if (prefs.view === "today" && !document.querySelector("dialog[open]")) render(); }, 60000);
})();
</script>
