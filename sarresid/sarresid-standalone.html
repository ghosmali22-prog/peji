<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>سررسید دوزبانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700;800&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: header with today's date, a composer (one text → one category), then tabs:
   Categories board, Today timeline, Translator. Boards show a Persian pane (RTL) beside a Thai pane (LTR). */
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --surface-2:#F5F7FB; --line:#D9DEE9;
  --ink:#17203A; --muted:#5B6580; --primary:#22305C; --on-primary:#FFFFFF;
  --accent:#DE9227; --accent-soft:#FBEBD2; --good:#1E9466; --bad:#CF4040;
  --chip-bg-l:93%; --chip-fg-l:30%; --stripe-l:52%; --shadow:0 1px 2px rgba(23,32,58,.06),0 6px 20px rgba(23,32,58,.06);
  --f-display:"Lalezar","Vazirmatn",Tahoma,sans-serif;
  --f-fa:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
  --f-th:"Sarabun","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2B; --surface-2:#1C2234; --line:#2A3148;
  --ink:#E6E9F2; --muted:#98A1B9; --primary:#B4C3FF; --on-primary:#0E1220;
  --accent:#F0AE4E; --accent-soft:#3A2D18; --good:#47C08E; --bad:#F07070;
  --chip-bg-l:21%; --chip-fg-l:80%; --stripe-l:60%; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2B; --surface-2:#1C2234; --line:#2A3148;
  --ink:#E6E9F2; --muted:#98A1B9; --primary:#B4C3FF; --on-primary:#0E1220;
  --accent:#F0AE4E; --accent-soft:#3A2D18; --good:#47C08E; --bad:#F07070;
  --chip-bg-l:21%; --chip-fg-l:80%; --stripe-l:60%; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-fa);font-size:15px;line-height:1.6}
[lang="th"]{font-family:var(--f-th)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:grid;gap:18px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex:none}
.brand h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.1}
.brand .sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line)}
.status-dot i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status-dot.on i{background:var(--good)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:11px;font-weight:500;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.accent{background:var(--accent);color:#1C1406;border-color:transparent;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px;flex:none}
.btn.sm svg{width:15px;height:15px}

.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.composer{padding:16px;display:grid;gap:12px}
.composer .lbl{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px}
.composer textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;line-height:1.75}
.composer textarea:focus,.tr-box textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.target{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.target select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px;max-width:220px}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.ex{border:1px dashed var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:12.5px;color:var(--muted)}
.ex:hover{color:var(--ink);border-color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13.5px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.side{display:grid;gap:18px;grid-template-rows:auto 1fr}
.ringcard{padding:16px;display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--surface-2)}
.ring .fg{stroke:var(--good);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{fill:var(--ink);font-weight:800;font-size:19px;font-family:var(--f-fa)}
.stats{display:grid;gap:4px}
.stats .k{font-size:13px;color:var(--muted)}
.stats .v{font-weight:700}
.stats .r{display:flex;gap:8px;align-items:center;font-size:13px}
.pill{display:inline-block;min-width:22px;text-align:center;border-radius:99px;padding:0 7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.mut{background:var(--surface-2);color:var(--muted)}
.next{padding:16px;display:grid;gap:6px;align-content:start}
.next .eyebrow{font-size:12px;color:var(--muted)}
.next .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
.next .ti{font-weight:700}
.next .th{color:var(--muted);font-size:14px}
.next .cd{font-size:13px;color:var(--muted)}

.reply{padding:14px 16px;display:grid;gap:10px;border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duo > div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.duo .tag{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;font-family:var(--f-fa)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs,.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;font-weight:500;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.tabs svg{width:16px;height:16px}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 10px}
.search input{border:0;background:transparent;padding:8px 2px;width:170px;outline:none}
.search svg{width:16px;height:16px;color:var(--muted)}

.panes{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.panes.single{grid-template-columns:1fr}
.pane{padding:16px;display:grid;gap:14px;min-width:0;align-content:start}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pane-head h2{margin:0;font-size:18px;font-weight:800}
.pane[lang="th"] .pane-head h2{font-family:var(--f-th);font-weight:700}
.flag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.panes:not(.single) .board{grid-template-columns:1fr}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:grid}
.grp-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 14px;background:hsl(var(--h) 60% var(--chip-bg-l))}
.grp-ic{width:34px;height:34px;border-radius:10px;background:hsl(var(--h) 55% var(--stripe-l));color:#fff;display:grid;place-items:center}
.grp-ic svg{width:18px;height:18px}
.grp-t{min-width:0}
.grp-t b{display:block;font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.grp-t small{color:var(--muted);font-size:12.5px}
.grp-acts{display:flex;gap:2px}
.grp-sum{padding:8px 14px 0;font-size:13px;color:var(--muted)}
.grp-items{padding:8px 10px 10px;display:grid;gap:6px}
.grp-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 12px 10px}
.prog{height:5px;border-radius:9px;background:var(--surface-2);flex:1;overflow:hidden}
.prog i{display:block;height:100%;background:hsl(var(--h) 55% var(--stripe-l));border-radius:9px}

.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface-2);border:1px solid transparent;border-radius:11px;padding:8px 10px;transition:border-color .15s}
.item:hover{border-color:var(--line)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid hsl(var(--h,220) 45% 55%);background:transparent;display:grid;place-items:center;margin-top:2px;padding:0}
.check svg{width:13px;height:13px;opacity:0;color:#fff}
.item.done .check{background:var(--good);border-color:var(--good)}
.item.done .check svg{opacity:1}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.item .body{min-width:0;cursor:pointer}
.ttl{font-weight:700;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:2px;font-size:12.5px;color:var(--muted)}
.kind{display:inline-flex;align-items:center;gap:3px}
.kind svg{width:13px;height:13px}
.when{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--ink)}
.when.late{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.hi{color:var(--bad);display:inline-flex;align-items:center;gap:2px;font-weight:700}
.hi svg{width:13px;height:13px}
.detail{font-size:13px;color:var(--muted);margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.missing{color:var(--bad);font-size:12px}
.amount{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ibtn{border:0;background:transparent;color:var(--muted);padding:5px;border-radius:8px;display:grid;place-items:center}
.ibtn:hover{background:var(--surface);color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty svg{width:46px;height:46px;opacity:.5}

.sec{display:grid;gap:8px}
.sec > h3{margin:0;font-size:13px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.sec > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sec.overdue > h3{color:var(--bad)}
.tl-row{display:grid;grid-template-columns:56px 18px minmax(0,1fr);align-items:start}
.tl-time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13.5px;padding-top:11px;color:var(--muted)}
.tl-axis{position:relative;align-self:stretch}
.tl-axis::before{content:"";position:absolute;inset-inline-start:8px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-axis::after{content:"";position:absolute;inset-inline-start:4px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid hsl(var(--h,220) 60% 50%)}
.tl-row.past .tl-time{opacity:.6}
.tl-row .item{margin-block:4px}
.now{display:grid;grid-template-columns:56px 18px 1fr;align-items:center;height:18px}
.now span{font-size:11.5px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.now i{height:2px;background:var(--accent);grid-column:2 / 4;position:relative}
.now i::before{content:"";position:absolute;inset-inline-start:3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.gtag{font-size:11.5px;border-radius:99px;padding:0 8px;background:hsl(var(--h) 60% var(--chip-bg-l));color:hsl(var(--h) 50% var(--chip-fg-l));white-space:nowrap}

.tr{padding:16px;display:grid;gap:14px}
.tr-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tr-head h2{margin:0;font-size:18px}
.tr-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.tr-box{display:grid;gap:8px;min-width:0;align-content:start}
.tr-box textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;line-height:1.8;font-size:16px}
.tr-box output{display:block;min-height:200px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;line-height:1.8;font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.tr-mid{display:grid;align-content:center;gap:8px}
.tr-lang select{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:6px 10px}
.tr-hist{display:grid;gap:6px}
.tr-hist button{text-align:start;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.tr-hist span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}

dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35);width:min(820px,calc(100vw - 24px));max-height:calc(100vh - 32px)}
#exportDlg{width:min(1100px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,14,28,.55)}
.dlg{display:grid;gap:14px;padding:18px}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-h h2{margin:0;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fld{display:grid;gap:4px;min-width:0}
.fld > span{font-size:12.5px;color:var(--muted);font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.dlg-f{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.dlg-f .g{display:flex;gap:8px;flex-wrap:wrap}
.danger{color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px 11px;cursor:pointer;font-size:13.5px}
.opt:has(input:checked){border-color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,transparent)}
.opt input{accent-color:var(--primary)}
.swatch{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.hues{display:flex;gap:6px;flex-wrap:wrap}
.hues label{width:28px;height:28px;border-radius:8px;background:hsl(var(--h) 55% 52%);cursor:pointer;border:2px solid transparent;position:relative}
.hues input{position:absolute;opacity:0;pointer-events:none}
.hues label:has(input:checked){border-color:var(--ink)}
.exp-grid{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.exp-side{display:grid;gap:12px;align-content:start}
.glist{display:grid;gap:2px;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.glist label{display:flex;gap:8px;align-items:center;padding:4px 6px;border-radius:7px;cursor:pointer;font-size:13.5px}
.glist label:hover{background:var(--surface-2)}
.glist input{accent-color:var(--primary)}
.preview{background:#8A93A8;border-radius:12px;padding:12px;overflow:auto;max-height:70vh;display:flex;justify-content:center}
.preview iframe{border:0;background:#8A93A8;width:794px;transform-origin:top left;display:block}
.prev-box{overflow:hidden;flex:none;position:relative;direction:ltr}
.preview iframe{position:absolute;left:0;top:0}

.toasts{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:50;padding-inline:16px}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:560px;font-size:14px}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:800}
.alarm{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));inset-inline:16px;margin-inline:auto;max-width:560px;z-index:60;background:var(--accent);color:#1C1406;border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.alarm svg{width:26px;height:26px}
.alarm b{display:block}
.alarm button{border:0;background:rgba(0,0,0,.12);border-radius:9px;padding:6px 10px;font-weight:700;color:inherit}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .side{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .panes{grid-template-columns:1fr}
  .exp-grid{grid-template-columns:1fr}
  .tr-grid{grid-template-columns:1fr}
  .tr-mid{grid-auto-flow:column;justify-content:center}
}
@media (max-width:560px){
  .side{grid-template-columns:1fr}
  .duo,.grid2{grid-template-columns:1fr}
  .grid4{grid-template-columns:1fr 1fr}
  .search input{width:120px}
  .brand h1{font-size:25px}
  .board{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap" dir="rtl" lang="fa">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 3v18"/><path d="M11.5 8h5M11.5 12h5M11.5 16h3"/></svg>
      </div>
      <div>
        <h1>سررسید دوزبانه</h1>
        <div class="sub"><span id="dateFa"></span><span lang="th" id="dateTh"></span></div>
      </div>
    </div>
    <div class="top-actions">
      <span class="status-dot" id="aiStatus"><i></i><span>…</span></span>

async function connectCloud() {

}

async function webTranslate(text, to) {
  if (!text.trim()) return "";

    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=" + to + "&dt=t&q=" + encodeURIComponent(text));

${week}
${target ? `These items will be ADDED to the existing category "${target.title_fa} / ${target.title_th}".` : "All items from this message form ONE new category."}

Message (Persian, Thai or mixed):
"""
${text}
"""

- Give the category a short, clear title (≤ 40 chars) that describes what the message is about (a client, project, errand list, day plan…).
- Split the message into separate items: one action or one piece of information per item. Keep everything the user wrote.
- Every text field exists in Persian (*_fa) AND Thai (*_th), whichever language the user wrote. Translate naturally; keep names and numbers recognisable.

Reply with only this JSON:
{"title_fa":"","title_th":"","summary_fa":"one short line on what this category holds","summary_th":"",

  const it = Object.assign({ id:uid(), kind:"task", title_fa:"", title_th:"", detail_fa:"", detail_th:"", date:null, time:null, end:null, priority:"normal", amount:null, currency:null, done:false }, base || {});

function simpleSplit(text) {

async function organizeSimple(text, target) {

function checkAlarms() {

  Object.keys(seen).forEach(k => { if (!k.startsWith(t)) delete seen[k]; });
  for (const [g, it] of allItems()) {

    const m = hmToMin(it.time), soon = t + it.id + ":s", now = t + it.id + ":n";

}

      a.disabled = true; const old = a.textContent; a.textContent = "در حال ترجمه…";
      try { await fillPairs(act === "translate-item" ? [["e-title_fa","e-title_th"],["e-detail_fa","e-detail_th"]] : [["g-title_fa","g-title_th"],["g-summary_fa","g-summary_th"]]); }
      catch { toast("ترجمه انجام نشد."); }
      a.disabled = false; a.textContent = old; break; }
    case "delete-group": {
      const g = S.groups.get(editing.group); if (!g) break;
      const before = clone(g); $("#groupDlg").close(); deleteGroup(g.id); toast("دسته حذف شد.", { label:"برگردون", run:() => putGroup(before) }); break; }
    case "print-now": { const fr = $("#prevFrame"); try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch { const r = lastSheet || await buildSheet(); saveFile(`barnameh-${stamp()}.html`, r.html, "text/html;charset=utf-8"); } break; }
    case "dl-sheet": { const r = lastSheet || await buildSheet(); saveFile(`barnameh-${stamp()}.html`, r.html, "text/html;charset=utf-8"); break; }
    case "dl-txt": saveFile(`barnameh-${stamp()}.txt`, sheetText()); break;
    case "copy-txt": copyText(sheetText()); break;
    case "tr-go": doTranslate(); break;
    case "tr-swap": { const f = $("#trFrom").value, t = $("#trTo").value; TR.from = t; TR.to = f === "auto" ? (t === "th" ? "fa" : "th") : f; TR.text = TR.out || $("#trIn").value; TR.out = ""; lsSet(K.tr, TR); render(); break; }
    case "tr-copy": copyText($("#trOut").textContent); break;
    case "tr-to-inbox": { const ta = $("#inbox"); ta.value = (ta.value ? ta.value.trim() + "\n" : "") + ($("#trOut").textContent || $("#trIn").value); lsSet(K.draft, ta.value); ta.focus(); window.scrollTo({ top:0, behavior:"smooth" }); break; }
    case "tr-hist": { const h = lsGet(K.trHist, [])[+a.dataset.k]; if (h) { TR.text = h.text; TR.out = h.out; TR.to = h.to; lsSet(K.tr, TR); render(); } break; }
    case "save-key": lsSet(K.key, $("#s-key").value.trim()); $("#setDlg").close(); render(); toast(AI.key() ? "کلید ذخیره شد. حالا Claude متن‌هات رو مرتب می‌کنه." : "کلید خالیه."); break;
    case "clear-key": lsSet(K.key, ""); $("#setDlg").close(); render(); toast("کلید پاک شد."); break;
    case "backup": saveFile(`sarresid-backup-${stamp()}.json`, JSON.stringify({ app:"sarresid", version:2, saved:new Date().toISOString(), groups:[...S.groups.values()] }, null, 1), "application/json"); break;
    case "restore": $("#importFile").click(); break;
    case "dl-app": {
      try { const r = await fetch("sarresid-standalone.html"); if (!r.ok) throw 0; saveFile("sarresid.html", await r.text(), "text/html;charset=utf-8"); }
      catch { toast("فایل نسخه مستقل پیدا نشد."); } break; }
    case "alarm-done": { const [g, it] = findItem(gid, iid); if (it) { const ng = clone(g); ng.items.find(i => i.id === iid).done = true; putGroup(ng); } $("#alarmHost").innerHTML = ""; break; }
    case "alarm-close": $("#alarmHost").innerHTML = ""; break;
  }
});
$("#editForm").addEventListener("submit", e => {
  e.preventDefault();
  const it = readItem();
  if (!it.title_fa && !it.title_th) { toast("حداقل یک عنوان بنویس."); return; }
  const src = S.groups.get(editing.gid), dst = S.groups.get($("#e-group").value) || src;
  if (!src) return;
  if (dst.id !== src.id) {
    const s2 = clone(src); s2.items = s2.items.filter(i => i.id !== it.id); putGroup(s2, true);
    const d2 = clone(dst); d2.items = [...(d2.items || []), it]; putGroup(d2);
  } else {
    const s2 = clone(src); const k = s2.items.findIndex(i => i.id === it.id);
    if (k >= 0) s2.items[k] = it; else s2.items.push(it); putGroup(s2);
  }
  $("#editDlg").close();
});
$("#groupForm").addEventListener("submit", e => {
  e.preventDefault();
  const g = S.groups.get(editing.group); if (!g) return;
  const ng = clone(g);
  for (const f of ["title_fa","title_th","summary_fa","summary_th"]) ng[f] = $("#g-" + f).value.trim();
  const h = document.querySelector('input[name="g-hue"]:checked'); if (h) ng.hue = +h.value;
  putGroup(ng); $("#groupDlg").close();
});

/* ================= boot ================= */
$("#dateFa").textContent = fmt("fa-IR-u-ca-persian", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(new Date());
$("#dateTh").textContent = fmt("th-TH", {weekday:"long", day:"numeric", month:"long", year:"numeric"}).format(new Date());
loadLocal(); render();
if (IS_ART) {
  claude.use("sample").then(s => { S.sample = s; render(); }).catch(() => {});
  claude.use("downloads").then(d => { S.downloads = d; }).catch(() => {});
  connectCloud().catch(() => {});
}
setInterval(checkAlarms, 20000); setTimeout(checkAlarms, 1500);
setInterval(() => { if (prefs.view !== "translate" && !document.querySelector("dialog[open]") && document.activeElement?.id !== "q") render(); }, 60000);
})();
</script>
