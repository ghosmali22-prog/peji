<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulranis Khamsuphap</title>
<meta name="description" content="Kulranis Khamsuphap — bank accounts and contact.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="KULRANIS KHAMSUPHAP">
<meta property="og:description" content="Bank accounts & contact · บัญชีธนาคารและติดต่อ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap">
<style>
  /* ============================================================
     EDIT HERE — colors. Black, white, and gold only as an accent.
     ============================================================ */
  :root {
    --bg: #000;
    --ink: #f4f1ec;
    --muted: rgba(244, 241, 236, .5);
    --faint: rgba(244, 241, 236, .1);
    --gold: #e3b866;
    --gold-soft: rgba(227, 184, 102, .55);
    --font: "Inter", "Sarabun", system-ui, sans-serif;
    --font-th: "Sarabun", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    overflow-x: hidden; -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .th { font-family: var(--font-th); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Black hole: real footage, then live particles on scroll ---------- */
  .space { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: #000; }
  .space video, .space canvas { position: absolute; display: block; }
  .space video {
    /* framed so the hole sits upper-centre; edges fade to pure black */
    -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
            mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 55%, transparent 100%);
    filter: contrast(1.12) saturate(1.05) brightness(.95);
    transform-origin: 49.6% 38.6%;
    will-change: transform, opacity, filter;
  }
  #dust { inset: 0; width: 100%; height: 100%; }
  .vignette { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 120% 80% at 50% 38%, transparent 40%, rgba(0,0,0,.85) 100%); }

  /* ---------- HERO ---------- */
  .hero { position: relative; z-index: 1; height: 260vh; }
  .stage { position: sticky; top: 0; height: 100vh; height: 100svh; overflow: hidden; pointer-events: none; }
  .title {
    position: absolute; left: 0; right: 0; bottom: 15%; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .word { display: flex; justify-content: center; white-space: nowrap; line-height: 1.05; }
  .word.l1, .word.l2 { font-weight: 200; font-size: clamp(34px, 10.2vw, 96px); letter-spacing: .12em; padding-left: .12em; }
  .rule { width: 44px; height: 1px; background: var(--gold); margin: 18px 0 14px; animation: grow 1.4s 1.6s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes grow { from { width: 0; } }
  .word.l3 { font-family: var(--font-th); font-weight: 300; font-size: clamp(15px, 4.4vw, 24px); letter-spacing: .12em; color: var(--muted); }
  .ch { display: inline-block; will-change: transform, opacity, filter; }
  .ch > i { display: inline-block; font-style: normal; animation: rise 1.6s cubic-bezier(.16,1,.3,1) backwards; animation-delay: calc(var(--i) * 45ms + 400ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(.6em); filter: blur(8px); } }
  .word .gap { width: .3em; }

  .scroll-hint {
    position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px; white-space: nowrap;
    font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: var(--muted);
    animation: fade 1s 2.4s backwards;
  }
  .scroll-hint .th { font-size: 12px; letter-spacing: .06em; text-transform: none; color: var(--ink); }
  .line-anim { width: 1px; height: 34px; background: linear-gradient(var(--gold), transparent); animation: drip 2s ease-in-out infinite; transform-origin: top; }
  @keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }

  /* ---------- CONTENT ---------- */
  main { position: relative; z-index: 2; width: min(100%, 520px); margin: -60vh auto 0; padding: 0 0 70px; }
  .label {
    margin: 64px 22px 18px; display: flex; align-items: center; gap: 12px;
    font-size: 11px; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  }
  .label .th { letter-spacing: .04em; text-transform: none; font-size: 12px; }
  .label::after { content: ""; flex: 1; height: 1px; background: var(--faint); }
  .label b { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); flex: none; }

  .rv { opacity: 0; transform: translateY(30px); filter: blur(6px); transition: opacity 1s ease, transform 1.1s cubic-bezier(.16,1,.3,1), filter 1s ease; }
  .rv.in { opacity: 1; transform: none; filter: none; }

  /* Swipeable 3D cards */
  .slider {
    display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none;
    padding: 10px 5% 6px; perspective: 1200px; overscroll-behavior-x: contain;
  }
  .slider::-webkit-scrollbar { display: none; }
  .slider.single { justify-content: center; }
  .slide { flex: 0 0 90%; scroll-snap-align: center; padding: 0 2%; transform-style: preserve-3d; transition: opacity .3s; }

  .card {
    --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 0%;
    position: relative; border-radius: 22px; cursor: pointer; transform-style: preserve-3d;
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
  }
  .card-inner {
    position: relative; min-height: 212px; border-radius: inherit; overflow: hidden;
    padding: 22px 22px 20px; display: flex; flex-direction: column;
    transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .3s ease-out;
    background:
      radial-gradient(140% 100% at 100% 0%, rgba(255,255,255,.07), transparent 50%),
      linear-gradient(160deg, #141414 0%, #070707 60%, #0c0c0c 100%);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: 0 30px 60px -25px rgba(0,0,0,1), 0 0 0 1px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
  }
  /* thin gold edge-light on top */
  .card-inner::before { content: ""; position: absolute; left: 16%; right: 16%; top: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .8; }
  /* soft sheen that follows the finger */
  .card-inner::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255,255,255,.09), transparent 45%); }
  .c-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .bank { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo-box { flex: none; height: 26px; display: flex; align-items: center; }
  .logo-box img { height: 100%; width: auto; display: block; }
  .logo-txt { font-weight: 600; font-size: 20px; letter-spacing: .02em; }
  .bank-name { font-weight: 500; font-size: 14px; line-height: 1.25; }
  .bank-name small { display: block; font-family: var(--font-th); font-weight: 400; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .acc-type { text-align: right; font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); line-height: 1.5; flex: none; }
  .acc-type .th { display: block; font-size: 11.5px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .chip { margin-top: 22px; width: 38px; height: 28px; border-radius: 6px; position: relative;
    background: linear-gradient(135deg, #f4dc9c, #c5953f 45%, #e8c77c 60%, #8d6322);
    box-shadow: inset 0 0 0 1px rgba(40,25,0,.35); }
  .chip::before { content: ""; position: absolute; inset: 0 33%; border-left: 1px solid rgba(60,40,0,.4); border-right: 1px solid rgba(60,40,0,.4); }
  .chip::after { content: ""; position: absolute; left: 0; right: 0; top: 48%; height: 1px; background: rgba(60,40,0,.4); }
  .acc-no { margin-top: 18px; font-weight: 300; font-size: clamp(25px, 7.6vw, 34px); letter-spacing: .06em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .c-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 16px; gap: 10px; }
  .c-bottom .lbl { font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .holder-en { font-weight: 500; font-size: clamp(12px, 3.6vw, 15px); letter-spacing: .12em; white-space: nowrap; }
  .holder-th { font-family: var(--font-th); font-weight: 400; font-size: 13.5px; color: var(--muted); margin-top: 2px; }
  .tap { font-size: 9px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 6px; flex: none; }
  .tap svg { width: 14px; height: 14px; stroke: var(--gold); }

  .actions { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; margin-top: 14px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 9px; padding: 14px 10px; border-radius: 14px; cursor: pointer;
    font-weight: 500; font-size: 13.5px; line-height: 1.2; text-align: left;
    background: transparent; border: 1px solid rgba(255,255,255,.14); transition: transform .15s, background .25s, color .25s;
  }
  .btn .th { display: block; font-size: 11px; font-weight: 400; opacity: .6; }
  .btn svg { width: 17px; height: 17px; stroke: currentColor; flex: none; }
  .btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
  .btn:active { transform: scale(.97); }
  .btn.ok { background: var(--gold); border-color: var(--gold); color: #000; }

  .dots { display: flex; justify-content: center; gap: 7px; margin-top: 20px; }
  .dots button { width: 6px; height: 6px; border-radius: 3px; border: 0; padding: 0; background: rgba(255,255,255,.22); cursor: pointer; transition: width .35s, background .35s; }
  .dots button.on { width: 22px; background: var(--gold); }
  .slider.single + .dots { display: none; }
  .swipe-note { text-align: center; font-size: 11px; color: var(--muted); margin-top: 10px; letter-spacing: .06em; }

  /* Phones */
  .phones { padding: 0 22px; }
  .phone { display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--faint); }
  .phone:first-child { border-top: 1px solid var(--faint); }
  .phone .copy-btn { flex: 1; min-width: 0; display: flex; align-items: center; gap: 16px; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
  .phone .ico { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--gold-soft); transition: background .25s; }
  .phone .ico svg { width: 18px; height: 18px; stroke: var(--gold); }
  .phone .num { font-weight: 300; font-size: clamp(21px, 6.4vw, 26px); letter-spacing: .05em; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .phone .hint { display: block; font-size: 10px; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; margin-top: 3px; }
  .phone .hint .th { letter-spacing: .02em; text-transform: none; }
  .phone .call { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); }
  .phone .call svg { width: 18px; height: 18px; stroke: #000; }
  .phone.copied .ico { background: var(--gold); }
  .phone.copied .ico svg { stroke: #000; }

  footer { text-align: center; margin-top: 64px; font-size: 10px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  footer b { display: block; font-weight: 300; font-size: 12px; letter-spacing: .4em; color: var(--ink); margin-bottom: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); z-index: 50;
    transform: translate(-50%, 150%); opacity: 0; white-space: nowrap;
    display: flex; align-items: center; gap: 10px; padding: 12px 20px 12px 14px; border-radius: 999px;
    background: rgba(20,20,20,.9); border: 1px solid rgba(255,255,255,.12); font-weight: 500; font-size: 13.5px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    transition: transform .5s cubic-bezier(.16,1,.3,1), opacity .3s;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  .toast .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); }
  .toast .dot svg { width: 12px; height: 12px; stroke: #000; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

      const sa = fly * c.sw * 2.2, cs = Math.cos(sa), sn = Math.sin(sa);
      const rx = x - hxs, ry = y - hys;
      x = hxs + rx * cs - ry * sn; y = hys + rx * sn + ry * cs;
      const dd = fly * c.v * reach;
      x += c.ux * dd; y += c.uy * dd;
      const a = alpha * clamp(lum / 160) * (.55 + c.j * .45);
      dctx.fillStyle = `rgba(${r},${g},${b},${a.toFixed(3)})`;
      const s = Math.max(1, cw * shrink * (lum > 140 ? 1 : .8));
      dctx.fillRect(x, y, s, s);
    }
    dctx.globalCompositeOperation = 'source-over';
  }

  /* =================== HERO TITLE =================== */
  const letters = [];
  let idx = 0;
  document.querySelectorAll('[data-split]').forEach((word, w) => {
    const text = word.textContent.trim();
    word.textContent = '';
    // Thai uses combining vowels/tone marks: split into grapheme clusters, not code points
    const parts = window.Intl && Intl.Segmenter
      ? [...new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(text)].map(s => s.segment)
      : [...text];
    parts.forEach((c, i) => {
      if (c === ' ') { const g = document.createElement('span'); g.className = 'gap'; word.appendChild(g); return; }
      const outer = document.createElement('span'); outer.className = 'ch';
      const inner = document.createElement('i'); inner.textContent = c; inner.style.setProperty('--i', idx++);
      outer.appendChild(inner); word.appendChild(outer);
      const off = i - (parts.length - 1) / 2;
      letters.push({ el: outer, x: off * (18 + rnd() * 30), y: -(40 + rnd() * 120), r: (rnd() - .5) * 40,
                     from: w * .025 + rnd() * .06, to: .35 + rnd() * .12 });
    });
  });

  const hero = document.getElementById('hero');
  const hint = document.getElementById('hint');
  const rule = document.getElementById('rule');
  let target = 0, p = 0;
  function readScroll() { target = clamp(scrollY / Math.max(1, hero.offsetHeight - innerHeight)); }
  addEventListener('scroll', readScroll, { passive: true });
  addEventListener('resize', readScroll);
  readScroll();

  function frame() {
    p += (target - p) * (reduce ? 1 : .1);
    // footage hands over to the particle copy almost immediately, then dissolves
    const hand = clamp(p / .06);
    video.style.opacity = 1 - hand;
    video.style.transform = `scale(${1 + p * .25})`;
    drawDust(p);

    letters.forEach(L => {
      const t = ease(clamp((p - L.from) / (L.to - L.from)));
      L.el.style.transform = `translate3d(${L.x * t}px, ${L.y * t}px, 0) rotate(${L.r * t}deg)`;
      L.el.style.opacity = 1 - t;
      L.el.style.filter = t > .01 ? `blur(${(t * 10).toFixed(1)}px)` : '';
    });
    rule.style.transform = `scaleX(${1 + p * 6})`;
    rule.style.opacity = 1 - clamp(p / .3);
    hint.style.opacity = 1 - clamp(p / .05);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* =================== BANK CARDS =================== */
  const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></svg>';
  const ICON_LIST = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>';
  const ICON_TAP = '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></svg>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const slider = document.getElementById('slider');
  const dots = document.getElementById('dots');

  BANKS.forEach(b => {
    const digits = b.number.replace(/\D/g, '');
    const all = `Bank: ${b.bank} (${b.bankTh})\nAccount number: ${b.number}\nAccount name: ${b.nameEn} (${b.nameTh})`;
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="card" tabindex="0" role="button" aria-label="Copy ${esc(b.bank)} account number" data-copy="${esc(digits)}" data-label="Account number">
        <div class="card-inner">
          <div class="c-top">
            <div class="bank">
              <span class="logo-box">${b.logo ? `<img src="${esc(b.logo)}" alt="">` : `<span class="logo-txt">${esc(b.mark)}</span>`}</span>
              <span class="bank-name">${b.logo ? '' : esc(b.bank)}<small>${esc(b.bankTh)}</small></span>
            </div>
            <div class="acc-type">${esc(b.type)}<span class="th">${esc(b.typeTh)}</span></div>
          </div>
          <div class="chip"></div>
          <div class="acc-no">${esc(b.number)}</div>
          <div class="c-bottom">
            <div>
              <div class="lbl">Account name · <span class="th">ชื่อบัญชี</span></div>
              <div class="holder-en">${esc(b.nameEn)}</div>
              <div class="holder-th">${esc(b.nameTh)}</div>
            </div>
            <div class="tap">${ICON_TAP}Tap</div>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn primary" data-copy="${esc(digits)}" data-label="Account number">${ICON_COPY}<span>Copy number<span class="th">คัดลอกเลขบัญชี</span></span></button>
        <button class="btn" data-copy="${esc(all)}" data-label="All details">${ICON_LIST}<span>Copy all<span class="th">คัดลอกทั้งหมด</span></span></button>
      </div>`;
    slider.appendChild(slide);
    const d = document.createElement('button');
    d.setAttribute('aria-label', `Show ${b.bank}`);
    d.addEventListener('click', () => slide.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }));
    dots.appendChild(d);
  });
  if (BANKS.length < 2) slider.classList.add('single');
  else {
    const note = document.createElement('div');
    note.className = 'swipe-note';
    note.innerHTML = 'Swipe for more banks · <span class="th">ปัดเพื่อดูธนาคารอื่น</span>';
    dots.after(note);
  }

  // Coverflow: cards turn in 3D as they slide away from the centre
  const slides = [...slider.children];
  function coverflow() {
    const mid = slider.scrollLeft + slider.clientWidth / 2;
    let best = 0, bestD = 1e9;
    slides.forEach((s, i) => {
      const d = (s.offsetLeft + s.offsetWidth / 2 - mid) / s.offsetWidth;
      if (Math.abs(d) < bestD) { bestD = Math.abs(d); best = i; }
      s.querySelector('.card').style.transform =
        `translateZ(${-Math.abs(d) * 180}px) rotateY(${clamp(d, -1.2, 1.2) * -40}deg) scale(${1 - Math.min(.14, Math.abs(d) * .12)})`;
      s.style.opacity = 1 - Math.min(.6, Math.abs(d) * .5);
    });
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === best));
  }
  slider.addEventListener('scroll', coverflow, { passive: true });
  addEventListener('resize', coverflow);
  coverflow();

  // Finger/mouse tilt + slow idle float
  slides.forEach((s, i) => {
    const card = s.querySelector('.card'), inner = s.querySelector('.card-inner');
    let touching = false;
    card.addEventListener('pointermove', e => {
      touching = true;
      const r = inner.getBoundingClientRect();
      const nx = clamp((e.clientX - r.left) / r.width), ny = clamp((e.clientY - r.top) / r.height);
      card.style.setProperty('--ry', ((nx - .5) * 18).toFixed(2) + 'deg');
      card.style.setProperty('--rx', ((.5 - ny) * 14).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (nx * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (ny * 100).toFixed(1) + '%');
    });
    card.addEventListener('pointerleave', () => { touching = false; });
    card.addEventListener('touchend', () => { touching = false; });
    if (!reduce) {
      let ph = i * 1.7;
      setInterval(() => {
        if (touching) return;
        ph += .035;
        card.style.setProperty('--ry', (Math.sin(ph) * 7).toFixed(2) + 'deg');
        card.style.setProperty('--rx', (Math.cos(ph * .8) * 4).toFixed(2) + 'deg');
        card.style.setProperty('--mx', (50 + Math.sin(ph) * 45).toFixed(1) + '%');
      }, 60);
    }
  });

  /* =================== COPY =================== */
  const toast = document.getElementById('toast'), toastText = document.getElementById('toastText');
  let toastTimer;
  function showToast(msg) {
    toastText.textContent = msg; toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      let ok = false; try { ok = document.execCommand('copy'); } catch {}
      ta.remove(); return ok;
    }
  }
  async function handle(el) {
    const ok = await copy(el.dataset.copy);
    showToast(ok ? `${el.dataset.label} copied · คัดลอกแล้ว` : 'Copy failed — long-press to copy');
    if (navigator.vibrate) navigator.vibrate(15);
    const host = el.closest('.phone') || el;
    host.classList.add(host.classList.contains('btn') ? 'ok' : 'copied');
    setTimeout(() => host.classList.remove('ok', 'copied'), 1400);
  }
  document.addEventListener('click', e => { const el = e.target.closest('[data-copy]'); if (el) handle(el); });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-copy]')) { e.preventDefault(); handle(e.target); }
  });

  /* =================== REVEAL =================== */
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold: .12 });
  document.querySelectorAll('.rv').forEach((el, i) => { el.style.transitionDelay = (i % 3) * 90 + 'ms'; io.observe(el); });
})();
</script>
</body>
</html>
